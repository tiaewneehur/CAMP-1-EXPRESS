<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camp 1 Express | ขนส่งสินค้าจากญี่ปุ่น</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      color: #152738;
      background: #f5f7fa;
      line-height: 1.65;
    }
    header { padding: 64px 24px; background: #14283e; color: white; }
    header div, main { max-width: 960px; margin: auto; }
    h1 { margin: 0; font-size: clamp(36px, 7vw, 64px); }
    header p { margin: 8px 0 0; font-size: 1.2rem; }
    main { padding: 24px; }
    section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    article { background: white; padding: 20px; border-radius: 12px; }
    article h3 { margin: 0; }
    article p { margin-bottom: 0; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Camp 1 Express</h1>
      <p>บริการฝากสั่ง ประมูล และขนส่งสินค้าจากญี่ปุ่นมาไทย</p>
    </div>
  </header>

  <main>
    <h2>บริการของเรา</h2>
    <section>
      <article>
        <h3>ฝากสั่งสินค้า</h3>
        <p>ฝากซื้อสินค้าจากร้านค้าในญี่ปุ่น</p>
      </article>
      <article>
        <h3>ฝากประมูล</h3>
        <p>ฝากประมูลสินค้าจากญี่ปุ่น</p>
      </article>
      <article>
        <h3>ขนส่งทางเรือ</h3>
        <p>จัดส่งสินค้าจากญี่ปุ่นมายังประเทศไทย</p>
      </article>
    </section>
  </main>
</body>
</html>
